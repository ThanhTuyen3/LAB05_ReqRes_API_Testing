name: API Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API Data-Driven Tests
        env:
          API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes.postman_collection.json \
            -e ReqRes_Env.postman_environment.json \
            -d users.csv \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "api-key=$API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Test-Report
          path: newman-report.html
          if-no-files-found: ignore
