name: ReqRes Performance Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Newman
        run: npm install -g newman

      - name: Monitor API Availability and Performance
        env:
          API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run .github/workflows/monitor-collection.json \
            --env-var "api-key=$API_KEY" \
            --reporters cli
mODNITOR
